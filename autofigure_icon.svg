<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <!-- Background: near-black rounded square -->
  <rect width="256" height="256" rx="56" fill="#0e1116"/>

  <!-- Hairline inner frame -->
  <rect x="20" y="20" width="216" height="216" rx="36"
        fill="none" stroke="#ffffff" stroke-opacity="0.14" stroke-width="2"/>

  <!-- Minimal node graph -->
  <polyline points="64,168 104,112 150,140 196,76"
            fill="none" stroke="#ecf1f6" stroke-width="9"
            stroke-linecap="round" stroke-linejoin="round"/>

  <!-- White nodes -->
  <circle cx="64" cy="168" r="10" fill="#ecf1f6"/>
  <circle cx="104" cy="112" r="10" fill="#ecf1f6"/>
  <circle cx="150" cy="140" r="10" fill="#ecf1f6"/>

  <!-- Accent node: mint ring with dark center -->
  <circle cx="196" cy="76" r="15" fill="#5ee4d4"/>
  <circle cx="196" cy="76" r="6" fill="#0e1116"/>
</svg>
